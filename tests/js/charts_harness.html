<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>fin-charts.js and fp-money.js harness</title>
<link rel="stylesheet" href="../../src/financas/interfaces/web/static/tokens.css">
<link rel="stylesheet" href="../../src/financas/interfaces/web/static/fin-charts.css">
<link rel="stylesheet" href="../../src/financas/interfaces/web/static/charts.css">
<link rel="stylesheet" href="../../src/financas/interfaces/web/static/fp-privacy.css">
<style>body{margin:0;width:800px}.fc-plot{width:700px}</style>
</head>
<body>
<section id="pace" class="card chart-card" data-chart="pace" data-src="/pace.json">
  <span data-fc="title" data-prefix="Ritmo ·"></span><span data-fc="value"></span><span data-fc="sub"></span>
  <span data-fc="chip-average"></span><span data-fc="chip-ceiling"></span>
  <span data-fc="legend-month"><span data-fc-text></span></span><span data-fc="legend-average" hidden><span data-fc-text></span></span><span data-fc="legend-ceiling" hidden><span data-fc-text></span></span>
  <div class="fc-plot" data-fc="plot"></div><p id="pace-desc" data-fc="desc"></p>
  <template data-tpl="sparse"><div class="fc-sparse"><span data-fc-avg-hint></span></div></template>
</section>
<section id="flow" class="card chart-card" data-chart="flow" data-src="/flow.json">
  <span data-fc="value"></span><span data-fc="sub"></span><span data-fc="chip-rate"></span><span data-fc="chip-delta"></span>
  <b data-fc="legend-in"></b><b data-fc="legend-out"></b>
  <div class="fc-plot" data-fc="plot"></div><p id="flow-desc" data-fc="desc"></p>
  <template data-tpl="sparse"><div class="fc-sparse"></div></template>
</section>
<!-- The <fp-patrimonio> island, as templates/patrimonio.html prints it (server fallback inside). -->
<fp-patrimonio id="fp" heading="Patrimônio" badge="parcial" range="Tudo" private="networth">
  <script type="application/json">{"points":[["2026-01-01",1000000],["2026-02-01",1100000],["2026-03-01",1050000],["2026-04-01",1200000],["2026-05-01",1250000],["2026-06-01",1230000],["2026-07-01",1300000],["2026-08-01",1400000],["2026-09-01",1485000]]}</script>
  <div class="fp-ssr"><p class="fp-ssr-v display"><span class="money money--display" data-cents="1485000" data-private="networth"><span class="currency-symbol">R$&nbsp;</span><span class="currency-amount">14.850,00</span></span></p></div>
</fp-patrimonio>
<script type="application/json" id="app-config">{"locale":"pt-BR","currency":"BRL"}</script>
<pre id="out">running</pre>
<script>
const fail = (m) => { document.getElementById("out").textContent = "FAIL harness crashed :: " + m + "\nDONE 1"; };
window.addEventListener("error", (e) => fail(e.message + " @" + e.filename + ":" + e.lineno));
window.addEventListener("unhandledrejection", (e) => fail(String(e.reason && e.reason.stack || e.reason)));
</script>
<script type="module">
document.getElementById("out").textContent = "module started";
const results = [];
const check = (name, ok, detail) => results.push((ok ? "PASS " : "FAIL ") + name + (ok ? "" : " :: " + detail));
const near = (a, b, eps = 1e-6) => Math.abs(a - b) <= eps;

// ---- fixtures served by the stubbed fetch (integer cents, ISO dates) ----
const pts = [];
for (let i = 0; i < 24; i++) {
  const d = new Date(2026, 0, 1 + i * 13);
  const iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  pts.push({ date: iso, cents: 1000000 + i * 25000 + (i % 3) * 7000 });
}
const last = pts[pts.length - 1].date;
const payloads = {
  "/pace.json": { month: "2026-09", days: 30, elapsed_days: 5, daily_cents: [0, 100, 0, 250, 50], daily_counts: [0, 1, 0, 2, 1],
    cumulative_cents: [0, 100, 100, 350, 400], average_cents: Array.from({ length: 30 }, (_, i) => 50 * (i + 1)), average_months: ["2026-07", "2026-08"],
    ceiling_cents: 300, crossed_day: 4, total_cents: 400, entry_count: 4 },
  "/flow.json": { year: 2026, months: [1, 2, 3, 4].map((m) => ({ month: "2026-0" + m, income_cents: 900000, expenses_cents: 300000 + m * 10000, refunds_cents: 0, balance_cents: 600000 - m * 10000 })) },
};
const realFetch = window.fetch.bind(window);
window.fetch = async (url) => (payloads[url] ? { ok: true, json: async () => payloads[url] } : realFetch(url));

let mod;
try {
  mod = await import("../../src/financas/interfaces/web/static/fin-charts.js");
} catch (error) {
  fail("import failed: " + error);
  throw error;
}
const { math, fmt, mountAll } = mod;

// ---- pure maths ----
check("clamp", math.clamp(5, 0, 3) === 3 && math.clamp(-1, 0, 3) === 0);
check("lerpArray", JSON.stringify(math.lerpArray([0, 10], [10, 20], 0.5)) === "[5,15]");
check("sameArray", math.sameArray([1, 2], [1, 2]) && !math.sameArray([1, 2], [1, 3]));
const series = [{ t: 0, v: 0 }, { t: 10, v: 100 }, { t: 100, v: 100 }];
const res = math.resampleByTime(series, 11);
check("resample is time-spaced (gap keeps the flat stretch)", near(res[0], 0) && near(res[1], 100) && near(res[10], 100) && res.length === 11, JSON.stringify(res));
check("resample single point", JSON.stringify(math.resampleByTime([{ t: 5, v: 7 }], 3)) === "[7,7,7]");
const day = 86400000;
const long = Array.from({ length: 10 }, (_, i) => ({ t: i * 10 * day, v: i }));
check("sliceByDays keeps the window", math.sliceByDays(long, 25).length === 3, math.sliceByDays(long, 25).length);
check("sliceByDays always keeps two points", math.sliceByDays(long, 1).length === 2);
check("sliceByDays infinity", math.sliceByDays(long, Infinity).length === 10);
check("valueAtTime clamps and interpolates", math.valueAtTime(long, -5) === 0 && math.valueAtTime(long, 5 * day) === 0.5 && math.valueAtTime(long, 1e12) === 9);
const ys = [0, 0, 10, 10, 10, 3, 3, 8];
const m = math.monotoneTangents(ys);
let overshoot = false;
for (let i = 0; i < ys.length - 1; i++) {
  for (let p = i; p <= i + 1; p += 0.05) {
    const v = math.hermiteAt(ys, m, p);
    if (v < Math.min(ys[i], ys[i + 1]) - 1e-9 || v > Math.max(ys[i], ys[i + 1]) + 1e-9) overshoot = true;
  }
}
check("monotone curve never leaves its neighbours (no false waves)", !overshoot);
check("hermite passes through the knots", ys.every((y, i) => near(math.hermiteAt(ys, m, i), y, 1e-9)));
check("flat stretch has zero tangent", m[0] === 0 && m[1] === 0);
check("monotonePath starts at the first point", math.monotonePath([0, 10], [5, 7], [0, 0]).startsWith("M0.00 5.00C"));
const dom = math.niceDomain([9000000, 9500000, 9300000]);
check("domain has at most three round lines inside it", dom.ticks.length <= 3 && dom.ticks.every((t) => t > dom.min && t < dom.max && t % 100000 === 0), JSON.stringify(dom));
const flat = math.niceDomain([500000, 500000, 500000]);
check("constant series has a finite domain", flat.max > flat.min && Number.isFinite(flat.min));
check("empty domain", math.niceDomain([]).ticks.length === 0);
const nt = math.niceTicks(1240000, 3);
check("niceTicks round top, at most three", nt.top >= 1240000 && nt.ticks.length <= 3 && nt.ticks.every((t) => t < nt.top), JSON.stringify(nt));
check("niceStep fits under the value", math.niceStep(1030000) === 500000 && math.niceStep(50) === 10000, math.niceStep(1030000));
check("spring starts at 0 and settles at ~1 without a big bounce", math.springProgress(0) === 0 && near(math.springProgress(0.95), 1, 0.01) && Math.max(...Array.from({ length: 100 }, (_, i) => math.springProgress(i / 100))) < 1.03);
check("x stops", math.xAxisStops(0, 30).map((s) => s.t).join() === "0,10,20,30");
check("stepPath", math.stepPath([0, 10], [5, 3], 9) === "M0.00 9.00V5.00H10.00V3.00");

// ---- pt-BR formatting ----
check("cents", fmt.cents(9511846) === "95.118,46" && fmt.cents(-5) === "−0,05" && fmt.cents(0) === "0,00" && fmt.cents(100000000) === "1.000.000,00");
check("signed cents", fmt.signedCents(1500) === "+15,00" && fmt.signedCents(-1500) === "−15,00" && fmt.signedCents(0) === "0,00");
check("percent", fmt.percent(34.94) === "34,9" && fmt.percent(-5) === "5" && fmt.percent(0.04) === "0");
check("thousands", fmt.thousands(9250000) === "92,5 mil" && fmt.thousands(500000) === "5 mil");
check("local ISO date", new Date(fmt.toEpoch("2026-03-01")).getDate() === 1 && new Date(fmt.toEpoch("2026-03-01")).getHours() === 0);
check("dates", fmt.shortDate(new Date(2026, 8, 5)) === "05 set" && fmt.longDate(new Date(2026, 3, 1)) === "qua, 01 abr 2026", fmt.longDate(new Date(2026, 3, 1)));

// ---- fp-money.js: one currency layer, the same golden vectors as tests/unit/test_fp_money.py ----
const money = await import("../../src/financas/interfaces/web/static/fp-money.js");
const golden = await (await realFetch("../golden/money.json")).json();
for (const c of golden.cases) {
  const o = { ...(c.sign ? { sign: c.sign } : {}), ...(c.locale ? { locale: c.locale, currency: c.currency } : {}) };
  check("golden " + c.minor + " " + (c.locale || "pt-BR") + " " + (c.sign || "auto"),
    money.formatCurrency(c.minor, o) === c.text && money.formatAmount(c.minor, o) === c.amount,
    JSON.stringify([money.formatCurrency(c.minor, o), money.formatAmount(c.minor, o), c.text]));
}
check("absent value is a dash, not zero", money.formatCurrency(null) === "—" && money.formatCurrency(undefined) === "—");
check("moneyHTML keeps the privacy group", money.moneyHTML(-18643, { private: "transactions" }).includes('data-private="transactions"') && money.moneyHTML(-18643).includes("data-neg"));
check("window.FP.money is the same instance fin-charts.js formats with", window.FP && window.FP.money && window.FP.money.formatAmount(123456) === fmt.cents(123456));

// ---- the <fp-patrimonio> island (static/charts.js) ----
const fpReady = new Promise((res) => document.getElementById("fp").addEventListener("fp-ready", (e) => res(e.detail), { once: true }));
await import("../../src/financas/interfaces/web/static/charts.js");
const detail = await Promise.race([fpReady, new Promise((r) => setTimeout(() => r(null), 3000))]);
const fpEl = document.getElementById("fp");
check("island upgrades and reports its points", !!detail && detail.count === 9, JSON.stringify(detail));
check("island draws an SVG and the last balance with the currency symbol", !!fpEl.querySelector("svg") && fpEl.textContent.includes("R$\u00a014.850,00"), fpEl.textContent.slice(0, 200));
check("island marks the figure for privacy mode", !!fpEl.querySelector('[data-private="networth"]') || fpEl.getAttribute("private") === "networth");

// ---- mounted charts ----
mountAll();
await new Promise((r) => setTimeout(r, 500));
const q = (sel, root = document) => root.querySelector(sel);
const pace = document.getElementById("pace");
check("pace shows crossing of the ceiling and the chips", !!q(".fc-cross-label", pace) && q('[data-fc="chip-ceiling"]', pace).textContent.startsWith("passou") && q('[data-fc="chip-average"]', pace).textContent.includes("acima da média"), q('[data-fc="chip-ceiling"]', pace).textContent + "|" + q('[data-fc="chip-average"]', pace).textContent);
check("pace value is the month total", q('[data-fc="value"]', pace).textContent === "4,00");
const pslider = q('[role="slider"]', pace);
pslider.focus();
pslider.dispatchEvent(new KeyboardEvent("keydown", { key: "Home", bubbles: true }));
check("pace scrubs by day", pslider.getAttribute("aria-valuenow") === "0" && q('[data-fc="sub"]', pace).textContent.startsWith("dia 1"), q('[data-fc="sub"]', pace).textContent);

const flow = document.getElementById("flow");
check("flow draws one column per month with bars", flow.querySelectorAll(".fc-col").length === 4 && flow.querySelectorAll(".fc-bar-in").length === 4, flow.querySelectorAll(".fc-col").length);
check("flow shows the latest month balance", q('[data-fc="value"]', flow).textContent === fmt.cents(600000 - 40000), q('[data-fc="value"]', flow).textContent);
check("flow with only four months is not sparse but shows the rate chip", q('[data-fc="chip-rate"]', flow).textContent.includes("% da renda poupados"), q('[data-fc="chip-rate"]', flow).textContent);


// ---- layout reads: cached, never one per pointer move ----
const reads = new Map();
const realRect = Element.prototype.getBoundingClientRect;
Element.prototype.getBoundingClientRect = function () { reads.set(this, (reads.get(this) || 0) + 1); return realRect.call(this); };
const widthReads = new Map();
const widthDesc = Object.getOwnPropertyDescriptor(HTMLElement.prototype, "offsetWidth");
Object.defineProperty(HTMLElement.prototype, "offsetWidth", { configurable: true, get() { widthReads.set(this, (widthReads.get(this) || 0) + 1); return widthDesc.get.call(this); } });
// headless --dump-dom with a virtual clock never paints, so requestAnimationFrame does not tick: stand in a 16 ms timer for it from here on
window.requestAnimationFrame = (fn) => setTimeout(() => fn(performance.now()), 16);
window.cancelAnimationFrame = (id) => clearTimeout(id);
const frames = (n) => new Promise((res) => setTimeout(res, 16 * n + 4));
const pr = pslider.getBoundingClientRect(); reads.clear();
pslider.dispatchEvent(new PointerEvent("pointerenter", { pointerType: "mouse", bubbles: true }));
for (let i = 0; i < 40; i++) pslider.dispatchEvent(new PointerEvent("pointermove", { clientX: pr.left + 8 + (i % 4) * 40, clientY: pr.top + 40, pointerType: "mouse", bubbles: true }));
const ptip = q(".fc-tip", pace);
check("scrub layer: 40 moves read its box once", (reads.get(pslider) || 0) === 1, reads.get(pslider));
check("tooltip width: measured per distinct text, not per move", (widthReads.get(ptip) || 0) <= 5, widthReads.get(ptip));
pslider.dispatchEvent(new PointerEvent("pointerleave", { pointerType: "mouse", bubbles: true }));
pslider.dispatchEvent(new PointerEvent("pointermove", { clientX: pr.left + 8, clientY: pr.top + 40, pointerType: "mouse", bubbles: true }));
check("a new visit measures again", (reads.get(pslider) || 0) === 2, reads.get(pslider));
pslider.dispatchEvent(new PointerEvent("pointerleave", { pointerType: "mouse", bubbles: true }));

// ---- ui.js: odometer text comes from fp-money.js; the old formatter is only the fallback ----
await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "../../src/financas/interfaces/web/static/ui.js"; s.onload = res; s.onerror = rej; document.head.append(s); });
const FinUI = window.FinUI;
const sample = [0, 5, -5, 99, 100, 123456, -123456, 100000000, 9511846];
const viaMoney = sample.map((c) => FinUI.formatCents(c));
const saved = window.FP.money;
window.FP.money = undefined;
const viaFallback = sample.map((c) => FinUI.formatCents(c));
window.FP.money = saved;
check("FinUI.formatCents: fp-money.js and the fallback agree", JSON.stringify(viaMoney) === JSON.stringify(viaFallback) && viaMoney[2] === "−0,05" && viaMoney[5] === "1.234,56" && viaMoney[7] === "1.000.000,00", JSON.stringify([viaMoney, viaFallback]));
const od = document.createElement("span");
od.className = "od"; od.setAttribute("data-odometer", "0");
document.body.append(od);
FinUI.odometer.set(od, 123456);
const cellText = () => Array.from(od.children).map((c) => c.textContent.replace(/[0-9]/g, "#")).join("");
check("odometer: separators and the cents tail are placed from the locale", od.getAttribute("aria-label") === "R$ 1.234,56" && !!od.querySelector(".od-tail") && od.querySelectorAll(".od-tail .od-d").length === 2, od.outerHTML.slice(0, 200));
FinUI.odometer.set(od, -99);
check("odometer: a different length rebuilds the cells, sign and label follow", od.getAttribute("aria-label") === "−R$ 0,99" && !!od.querySelector(".od-sign") && od.querySelectorAll(".od-d").length === 3, od.getAttribute("aria-label"));
od.remove();

// ---- fp-money.js observer: new elements and changed attributes still hydrate ----
const host = document.createElement("div");
host.innerHTML = '<span data-cents="123"></span>';
document.body.append(host);
await frames(2);
const span = host.firstElementChild;
check("hydration: an element added later is filled", span.textContent.replace(/\s/g, " ") === "R$ 1,23", span.textContent);
span.setAttribute("data-cents", "456");
await frames(2);
check("hydration: a changed data-cents is redone", span.textContent.replace(/\s/g, " ") === "R$ 4,56", span.textContent);
host.remove();

// ---- fp-ui.js: card tilt reads the layout once per enter; .sx edges are batched and released ----
const unobserved = [];
const realUnobserve = ResizeObserver.prototype.unobserve;
ResizeObserver.prototype.unobserve = function (el) { unobserved.push(el); return realUnobserve.call(this, el); };
const stage = document.createElement("div");
stage.innerHTML = '<span class="card-face" data-card-tilt style="position:fixed;left:10px;top:10px;width:200px;height:120px;display:block"></span>' +
  [1, 2, 3].map(() => '<div class="sx" style="width:100px;overflow:auto"><div style="width:400px;height:10px"></div></div>').join("");
document.body.append(stage);
const ui = await import("../../src/financas/interfaces/web/static/fp-ui.js");
await frames(2);
const sxs = [...stage.querySelectorAll(".sx")];
check("sx edges: every scrollable area is marked (right edge open, left closed)", sxs.every((e) => e.getAttribute("data-sx-r") === "1" && e.getAttribute("data-sx-l") === "0"), sxs.map((e) => e.outerHTML.slice(0, 80)).join("|"));
const card = stage.firstElementChild;
reads.clear();
const move = (x, y, target = card) => target.dispatchEvent(new PointerEvent("pointermove", { clientX: x, clientY: y, pointerType: "mouse", bubbles: true }));
for (let i = 0; i < 12; i++) { move(30 + i * 10, 40 + i * 4); await frames(1); }
check("tilt: the card is tracked and tilted", card.getAttribute("data-tilt-state") === "track" && card.style.getPropertyValue("--tilt-x") !== "", card.outerHTML.slice(0, 200));
check("tilt: its box was read once for 12 moves in 12 frames", (reads.get(card) || 0) === 1, reads.get(card));
move(700, 500, document.body);
await frames(2);
check("tilt: leaving the card springs it back", card.getAttribute("data-tilt-state") === "leave", card.getAttribute("data-tilt-state"));
move(100, 60);
move(110, 70);
await frames(1);
Object.defineProperty(document, "hidden", { configurable: true, get: () => true });
document.dispatchEvent(new Event("visibilitychange"));
check("tilt: hiding the tab lets go at once and cancels the queued frame", !card.hasAttribute("data-tilt-state") && card.style.getPropertyValue("--tilt-x") === "", card.outerHTML.slice(0, 160));
delete document.hidden;
sxs[0].remove();
await frames(3);
check("sx edges: a removed area is released from the ResizeObserver", unobserved.includes(sxs[0]), unobserved.length);
stage.remove();


// ---- fp-widgets.js must leave the privacy master switch to fp-privacy.js (it used to flip aria-checked back after every click) ----
await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "../../src/financas/interfaces/web/static/fp-privacy.js"; s.onload = res; s.onerror = rej; document.head.append(s); });
await import("../../src/financas/interfaces/web/static/fp-widgets.js");
const master = document.createElement("button");
master.type = "button"; master.setAttribute("role", "switch"); master.setAttribute("aria-checked", "false"); master.setAttribute("data-fp-privacy", "master");
document.body.append(master);
await frames(2);
master.click();
await frames(2);
const masked = document.documentElement.hasAttribute("data-privacy-mask");
check("privacy master switch: aria-checked follows the mask after a click", masked && master.getAttribute("aria-checked") === "true", masked + " " + master.getAttribute("aria-checked"));
master.click();
await frames(2);
check("privacy master switch: and after the next one", !document.documentElement.hasAttribute("data-privacy-mask") && master.getAttribute("aria-checked") === "false", master.getAttribute("aria-checked"));
master.remove();
try { localStorage.removeItem("fp_privacy_settings"); } catch (e) { /* storage blocked */ }

document.getElementById("out").textContent = results.join("\n") + "\nDONE " + results.filter((x) => x.startsWith("FAIL")).length;
</script>
</body>
</html>
