<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Quick entry form: payment method and items editor visibility (app.js)</title>
</head>
<body>
<form id="f">
  <input type="radio" name="kind" value="expense" id="k-expense" checked>
  <input type="radio" name="kind" value="income" id="k-income">
  <input type="radio" name="kind" value="transfer" id="k-transfer">
  <select name="account_id" id="acct" data-entry-account>
    <option value="bank" data-account-kind="checking" selected>Conta</option>
    <option value="card" data-account-kind="credit_card">Cartão</option>
  </select>
  <input name="amount" id="amount" value="100,00">
  <select name="category_id" id="category"><option value="a" selected>A</option><option value="b">B</option></select>
  <fieldset data-method-field data-side="expense" id="method">
    <label><input type="radio" name="payment_method" value="pix" checked></label>
    <label><input type="radio" name="payment_method" value="debito"></label>
    <label><input type="radio" name="payment_method" value="boleto"></label>
    <label><input type="radio" name="payment_method" value="outro"></label>
  </fieldset>
  <fieldset data-split-field id="splits">
    <fieldset class="split-editor" data-split-editor>
      <input type="hidden" name="splits_present" value="1">
      <input id="toggle" type="checkbox" data-split-toggle-items>
      <div data-split-items hidden>
        <div data-split-rows></div><button type="button" data-split-add id="add">+</button>
        <p data-split-remaining id="remaining"></p><p data-split-note></p>
      </div>
      <template data-split-template>
        <div class="split-row"><input type="text" name="item_description"><select name="item_category"><option value="a">A</option></select>
        <span class="money-field"><input class="split-amount" type="text" name="item_amount"></span><button type="button" data-split-remove>x</button></div>
      </template>
    </fieldset>
  </fieldset>
  <button type="submit" id="save">Salvar</button>
</form>
<pre id="out">running</pre>
<script>
window.addEventListener("error", (e) => { document.getElementById("out").textContent = "FAIL harness crashed :: " + e.message + "\nDONE 1"; });
</script>
<script>
// what the page asks of htmx: the swap of the field for the other side (the server's answer is tested apart)
window.asked = [];
window.htmx = { ajax: (method, url) => { window.asked.push(method + " " + url); return Promise.resolve(); } };
</script>
<script src="../../src/financas/interfaces/web/static/money-mask.js"></script>
<script src="../../src/financas/interfaces/web/static/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
const results = [];
const check = (name, got, want) => results.push((got === want ? "PASS " : "FAIL ") + name + (got === want ? "" : " :: got " + JSON.stringify(got) + " want " + JSON.stringify(want)));
const $ = (id) => document.getElementById(id);
const change = (el) => el.dispatchEvent(new Event("change", { bubbles: true }));
const sent = () => Array.from(new FormData($("f")).keys());

// an expense on a checking account: method and items are offered
check("method shown for a bank expense", $("method").hidden, false);
check("items shown for an expense", $("splits").hidden, false);
check("method radios are sent", sent().includes("payment_method"), true);
// a card: the method is hidden and not sent (a card purchase is always "cartão de crédito")
$("acct").value = "card"; change($("acct"));
check("method hidden on a card", $("method").hidden, true);
check("method not sent on a card", sent().includes("payment_method"), false);
check("items stay for a card expense", $("splits").hidden, false);
$("acct").value = "bank"; change($("acct"));
check("method back on a bank account", $("method").hidden, false);
// income: a method yes, items no
$("k-income").checked = true; change($("k-income"));
check("method for income", $("method").hidden, false);
check("items hidden for income", $("splits").hidden, true);
check("items not sent for income", sent().includes("splits_present"), false);
// the options follow the direction of the money: an income form never carries Débito or Boleto
// (the server would have swapped the expense field back in: do the same by hand)
$("method").innerHTML = '<label><input type="radio" name="payment_method" value="pix" checked></label><label><input type="radio" name="payment_method" value="debito"></label><label><input type="radio" name="payment_method" value="boleto"></label><label><input type="radio" name="payment_method" value="outro"></label>';
$("method").setAttribute("data-side", "expense");
$("k-expense").checked = true; window.asked.length = 0;
const values = () => Array.from(document.querySelectorAll("#method input")).map((i) => i.value).join(",");
check("expense side has the four", values(), "pix,debito,boleto,outro");
document.querySelector('#method input[value="boleto"]').checked = true;
$("k-income").checked = true; change($("k-income"));
check("débito and boleto are detached on income", values(), "pix,outro");
check("boleto falls back to pix on income", document.querySelector("#method input:checked").value, "pix");
check("the field says it is on the income side", $("method").getAttribute("data-side"), "income");
check("the server is asked for the income field", window.asked[window.asked.length - 1], "GET /entries/method-field?kind=income&current=pix");
$("k-expense").checked = true; change($("k-expense"));
check("the server is asked for the expense field", window.asked[window.asked.length - 1], "GET /entries/method-field?kind=expense&current=pix");
check("pix stays checked on the way back", document.querySelector("#method input:checked").value, "pix");
$("k-income").checked = true; change($("k-income"));
const askedBefore = window.asked.length;
change($("k-income"));
check("no second request while the side is the same", window.asked.length, askedBefore);
check("income has neither debito nor boleto in the DOM", document.querySelectorAll('#method input[value="debito"], #method input[value="boleto"]').length, 0);
// a transfer: neither
$("k-transfer").checked = true; change($("k-transfer"));
check("method hidden for a transfer", $("method").hidden, true);
// turning the items on, then switching to income, drops them and gives the category back
$("k-expense").checked = true; change($("k-expense"));
$("toggle").checked = true; change($("toggle"));
check("parent category locked while the items are on", $("category").disabled, true);
check("two rows were added", document.querySelectorAll("[data-split-rows] .split-row").length, 2);
$("k-income").checked = true; change($("k-income"));
check("toggle turned off by the kind switch", $("toggle").checked, false);
check("rows removed", document.querySelectorAll("[data-split-rows] .split-row").length, 0);
check("parent category unlocked again", $("category").disabled, false);
check("no orphan items are sent", sent().some((k) => k.startsWith("item_")), false);

const failed = results.filter((r) => r.startsWith("FAIL")).length;
document.getElementById("out").textContent = results.join("\n") + "\nDONE " + failed;
});
</script>
</body>
</html>
