<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Smart suggestions of the entry form (suggestions.js)</title>
</head>
<body>
<form id="f" class="quick-form">
  <input type="radio" name="kind" value="expense" id="k-expense" checked>
  <input type="radio" name="kind" value="income" id="k-income">
  <label class="suggest-host"><input type="text" name="description" id="description" data-suggest role="combobox" aria-expanded="false" aria-controls="description-suggestions"><ul id="description-suggestions" class="suggest-list" role="listbox" hidden></ul></label>
  <select name="category_id" id="category"><option value="">Auto</option><option value="cat-food">Alimentação</option><option value="cat-salary">Salário</option></select>
  <select name="account_id" id="account" data-entry-account>
    <option value="acc-bank" data-account-kind="checking" selected>Conta BB</option>
    <option value="acc-card" data-account-kind="credit_card">Cartão</option>
  </select>
  <fieldset data-method-field data-side="expense" id="method">
    <label><input type="radio" name="payment_method" value="pix" checked></label>
    <label><input type="radio" name="payment_method" value="debito"></label>
    <label><input type="radio" name="payment_method" value="boleto"></label>
    <label><input type="radio" name="payment_method" value="outro"></label>
  </fieldset>
  <span class="money-field"><input type="text" name="amount" id="amount" inputmode="decimal"></span>
</form>
<script type="application/json" id="suggestions-data">{
  "expense": [
    {"description": "Almoço Restaurante Central", "flow": "expense", "category_id": "cat-food", "category_name": "Alimentação", "account_id": "acc-bank", "account_name": "Conta BB", "payment_method": "debito", "payment_label": "Débito", "habitual_amount_cents": 3500, "habitual_amount": "35,00"},
    {"description": "Almoço Restaurante Central", "flow": "expense", "category_id": "cat-food", "category_name": "Alimentação", "account_id": "acc-card", "account_name": "Cartão", "payment_method": "cartao_credito", "payment_label": "Cartão de crédito", "habitual_amount_cents": 3500, "habitual_amount": "35,00"},
    {"description": "Uber", "flow": "expense", "category_id": "cat-food", "category_name": "Alimentação", "account_id": "acc-card", "account_name": "Cartão", "payment_method": "cartao_credito", "payment_label": "Cartão de crédito", "habitual_amount_cents": null, "habitual_amount": null}
  ],
  "income": [
    {"description": "Salário", "flow": "income", "category_id": "cat-salary", "category_name": "Salário", "account_id": "acc-bank", "account_name": "Conta BB", "payment_method": "ted", "payment_label": "TED", "habitual_amount_cents": 500000, "habitual_amount": "5000,00"}
  ]
}</script>
<pre id="out">running</pre>
<script>
window.addEventListener("error", (e) => { document.getElementById("out").textContent = "FAIL harness crashed :: " + e.message + "\nDONE 1"; });
</script>
<script src="../../src/financas/interfaces/web/static/money-mask.js"></script>
<script src="../../src/financas/interfaces/web/static/app.js"></script>
<script src="../../src/financas/interfaces/web/static/suggestions.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
const results = [];
const check = (name, got, want) => results.push((got === want ? "PASS " : "FAIL ") + name + (got === want ? "" : " :: got " + JSON.stringify(got) + " want " + JSON.stringify(want)));
const $ = (id) => document.getElementById(id);
const options = () => Array.from(document.querySelectorAll("#description-suggestions li .suggest-title")).map((o) => o.textContent).join("|");
const listOpen = () => !$("description-suggestions").hidden;
const type = (text) => { $("description").focus(); $("description").value = text; $("description").dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: text.slice(-1) })); };
const click = (index) => { const li = document.querySelectorAll("#description-suggestions li")[index]; li.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, cancelable: true })); };
const key = (name) => $("description").dispatchEvent(new KeyboardEvent("keydown", { key: name, bubbles: true, cancelable: true }));
const reset = () => { $("description").blur(); $("category").value = ""; $("account").value = "acc-bank"; $("amount").value = ""; $("description").value = ""; $("method").hidden = false; $("method").disabled = false; document.querySelector('#method input[value="pix"]').checked = true; };

// focusing the empty field already offers the habits (each description once, best first)
$("description").focus();
check("focus opens the list with each expense habit once", options(), "Almoço Restaurante Central|Uber");
check("the list is visible and announced", listOpen() && $("description").getAttribute("aria-expanded") === "true", true);
check("each option shows where it goes", document.querySelector("#description-suggestions li .suggest-meta").textContent, "Alimentação · Conta BB · Débito · R$ 35,00");

// typing filters (accent- and case-insensitive); typing alone never cascades
type("almoco");
check("typing filters the list", options(), "Almoço Restaurante Central");
check("typing does not cascade", $("account").value + "|" + $("category").value, "acc-bank|");
click(0);
check("the pick fills the field", $("description").value, "Almoço Restaurante Central");
check("the pick closes the list", listOpen(), false);
check("category follows", $("category").value, "cat-food");
check("account follows", $("account").value, "acc-bank");
check("method follows", document.querySelector("#method input:checked").value, "debito");
check("the habitual amount fills an empty field", $("amount").value, "35,00");

// an amount already typed is never replaced
reset(); $("amount").value = "12,00";
type("Almoço"); click(0);
check("a typed amount stays", $("amount").value, "12,00");

// keyboard: arrows move, Enter picks (and does not submit), Escape closes
reset(); $("description").focus(); type("");
key("ArrowDown"); key("ArrowDown");
check("arrow down highlights the second", document.querySelector('#description-suggestions li[aria-selected="true"] .suggest-title').textContent, "Uber");
key("Enter");
check("enter picks the highlighted one", $("account").value, "acc-card");
check("a card hides the method field", $("method").hidden, true);
check("no habitual amount, no amount", $("amount").value, "");
reset(); $("description").focus(); type("ub");
check("the list reopens on typing", listOpen(), true);
key("Escape");
check("escape closes", listOpen(), false);

// a committed, exactly typed habit also cascades
reset(); type("Uber"); $("description").dispatchEvent(new Event("change", { bubbles: true }));
check("a committed known habit cascades", $("account").value, "acc-card");

// unknown text: nothing to offer, nothing changes
reset(); type("Algo novo"); $("description").dispatchEvent(new Event("change", { bubbles: true }));
check("an unknown description has no list", listOpen(), false);
check("an unknown description changes nothing", $("category").value + "|" + $("account").value + "|" + $("amount").value, "|acc-bank|");

// income: its own list, its own method
reset();
$("k-income").checked = true; $("k-income").dispatchEvent(new Event("change", { bubbles: true }));
$("description").focus();
check("the list switches to income habits", options(), "Salário");
check("the income field has no débito or boleto", document.querySelectorAll('#method input[value="debito"], #method input[value="boleto"]').length, 0);
$("method").insertAdjacentHTML("beforeend", '<label><input type="radio" name="payment_method" value="ted"></label>');  // the server's income field has TED
click(0);
check("income category", $("category").value, "cat-salary");
check("income arrives by ted", document.querySelector("#method input:checked").value, "ted");
check("income amount", $("amount").value, "5.000,00");
$("k-expense").checked = true; $("k-expense").dispatchEvent(new Event("change", { bubbles: true }));
$("description").value = ""; $("description").focus(); $("description").dispatchEvent(new Event("input", { bubbles: true }));
check("back to the expense habits", options(), "Almoço Restaurante Central|Uber");

const failed = results.filter((r) => r.startsWith("FAIL")).length;
document.getElementById("out").textContent = results.join("\n") + "\nDONE " + failed;
});
</script>
</body>
</html>
