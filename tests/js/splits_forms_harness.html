<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Items editor on the purchase form and on an installment's form (app.js)</title>
</head>
<body>
<!-- the card purchase form -->
<form id="buy">
  <select id="cat" name="category_id"><option value="">Não categorizado</option><option value="food">Alimentação</option><option value="home">Casa</option></select>
  <span class="money-field"><span class="cur">R$</span><input id="total" type="text" name="amount" value=""></span>
  <label><input type="radio" name="amount_mode" value="total" checked> total</label>
  <label><input type="radio" name="amount_mode" value="installment" id="mode-inst"> parcela</label>
  <input id="n" type="text" name="installments" value="1">
  <input id="cur-n" type="text" name="current_installment" value="1">
  <fieldset class="split-editor" data-split-editor data-split-purchase>
    <input type="hidden" name="splits_present" value="1">
    <label data-split-toggle-label><input id="toggle" type="checkbox" data-split-toggle-items> Adicionar itens</label>
    <div data-split-items hidden>
      <div data-split-rows></div>
      <button type="button" id="add" data-split-add>+</button>
      <p id="remaining" data-split-remaining></p>
      <p id="note" data-split-note></p>
    </div>
    <template data-split-template>
      <div class="split-row">
        <input type="text" name="split_descriptions">
        <select name="split_categories"><option value="a">A</option></select>
        <span class="money-field"><input class="split-amount" type="text" name="split_amounts"></span>
        <button type="button" data-split-remove>×</button>
      </div>
    </template>
  </fieldset>
  <button type="submit" id="save">Salvar compra</button>
</form>

<!-- an installment's edit form: the editor knows the plan-wide scope -->
<form id="edit">
  <select id="ecat" name="category_id" data-restore="home"><option value="food">Alimentação</option><option value="home">Casa</option></select>
  <span class="money-field"><span class="cur">R$</span><input id="etotal" type="text" name="amount" value="150,00"></span>
  <label><input id="wide" type="checkbox" name="propagate" value="1" checked> aplicar a todas</label>
  <fieldset class="split-editor" data-split-editor data-plan-total="30000" data-plan-count="2" data-target-amount="15000">
    <input type="hidden" name="splits_present" value="1">
    <label data-split-toggle-label><input id="etoggle" type="checkbox" data-split-toggle-items> Adicionar itens</label>
    <div data-split-items hidden>
      <div data-split-rows></div>
      <button type="button" id="eadd" data-split-add>+</button>
      <p id="eremaining" data-split-remaining></p>
      <p id="enote" data-split-note></p>
    </div>
    <template data-split-template>
      <div class="split-row">
        <input type="text" name="item_description">
        <select name="item_category"><option value="a">A</option></select>
        <span class="money-field"><input class="split-amount" type="text" name="item_amount"></span>
        <button type="button" data-split-remove>×</button>
      </div>
    </template>
  </fieldset>
  <button type="submit" id="esave">Salvar</button>
</form>
<pre id="out">running</pre>
<script>
const fail = (m) => { document.getElementById("out").textContent = "FAIL harness crashed :: " + m + "\nDONE 1"; };
window.addEventListener("error", (e) => fail(e.message + " @" + e.filename + ":" + e.lineno));
</script>
<script>
const base = "../../src/financas/interfaces/web/static/";
for (const name of ["money-mask", "app"]) document.write('<script src="' + base + name + '.js"><\/script>');
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {
const results = [];
const check = (name, got, want) => results.push((got === want ? "PASS " : "FAIL ") + name + (got === want ? "" : " :: got " + JSON.stringify(got) + " want " + JSON.stringify(want)));
const $ = (id) => document.getElementById(id);
const fire = (el, name) => el.dispatchEvent(new Event(name, { bubbles: true }));
function type(input, text) {
  for (const ch of text) {
    input.value += ch;
    input.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: ch }));
  }
}
const amounts = (form) => Array.from(form.querySelectorAll(".split-amount"));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

(async () => {
  // ---- the purchase form: parent category lock ----
  $("cat").value = "food";
  $("toggle").checked = true; fire($("toggle"), "change");
  check("parent select is disabled", $("cat").disabled, true);
  check("parent select is cleared", $("cat").value, "");
  check("helper label", $("cat").selectedOptions[0].textContent, "Categorizado por item abaixo");
  check("a disabled field is not submitted", new FormData($("buy")).has("category_id"), false);
  $("toggle").checked = false; fire($("toggle"), "change");
  check("parent select is enabled again", $("cat").disabled, false);
  check("parent select got its value back", $("cat").value, "food");
  check("placeholder removed", $("cat").querySelector("option[data-split-placeholder]"), null);

  // ---- installments stay available; the items are the whole purchase ----
  $("n").value = "3"; fire($("n"), "change");
  check("toggle stays enabled with 3 installments", $("toggle").disabled, false);
  type($("total"), "45000");
  $("toggle").checked = true; fire($("toggle"), "change");
  check("two rows", amounts($("buy")).length, 2);
  check("distribution note", $("note").textContent, "Os itens serão distribuídos proporcionalmente entre as 3 faturas.");
  type(amounts($("buy"))[0], "35000"); type(amounts($("buy"))[1], "10000");
  check("items = the whole purchase", $("remaining").textContent, "Total distribuído com sucesso");
  check("save enabled", $("save").disabled, false);
  amounts($("buy"))[1].value = ""; type(amounts($("buy"))[1], "9000");
  check("short by 10,00", $("remaining").textContent, "Restam R$ 10,00");
  check("save blocked", $("save").disabled, true);

  // ---- installment value mode: the total is value x installments ----
  $("total").value = ""; type($("total"), "15000");
  $("mode-inst").checked = true; fire($("mode-inst"), "change");
  check("total from the installment value", $("note").textContent,
    "Total da compra: R$ 450,00 (3 x R$ 150,00) · Os itens serão distribuídos proporcionalmente entre as 3 faturas.");
  amounts($("buy"))[1].value = ""; type(amounts($("buy"))[1], "10000");
  check("35000 + 10000 = 150,00 x 3", $("remaining").textContent, "Total distribuído com sucesso");
  $("n").value = "1"; fire($("n"), "change");
  check("one payment: just the value", $("remaining").textContent, "Ultrapassou R$ 300,00");
  check("one payment: no distribution note", $("note").textContent, "Total da compra: R$ 150,00 (1 x R$ 150,00)");

  // ---- an installment's edit form: plan-wide scope vs single ----
  $("ecat").value = "food";
  $("etoggle").checked = true; fire($("etoggle"), "change");
  check("edit: parent locked", $("ecat").disabled, true);
  type(amounts($("edit"))[0], "20000"); type(amounts($("edit"))[1], "10000");
  check("plan-wide: items = the covered installments (2 x 150,00)", $("eremaining").textContent, "Total distribuído com sucesso");
  check("plan-wide note", $("enote").textContent.startsWith("Itens do parcelamento: valem para as 2 parcela(s) ainda abertas (total R$ 300,00)"), true);
  $("etotal").value = ""; type($("etotal"), "16000");  // this installment is now 160,00
  check("amount moved: plan total follows", $("eremaining").textContent, "Restam R$ 10,00");  // 310,00 now
  $("wide").checked = false; fire($("wide"), "change");
  check("single scope: this installment only", $("enote").textContent, "Itens só desta parcela (R$ 160,00); as outras parcelas não mudam.");
  check("single scope: 300,00 of 160,00", $("eremaining").textContent, "Ultrapassou R$ 140,00");
  amounts($("edit"))[0].value = ""; type(amounts($("edit"))[0], "10000");
  amounts($("edit"))[1].value = ""; type(amounts($("edit"))[1], "6000");
  check("single scope adds up", $("eremaining").textContent, "Total distribuído com sucesso");
  check("edit: save enabled", $("esave").disabled, false);
  $("etoggle").checked = false; fire($("etoggle"), "change");
  check("edit: parent unlocked with its value", $("ecat").disabled === false && $("ecat").value, "food");

  const failed = results.filter((r) => r.startsWith("FAIL")).length;
  document.getElementById("out").textContent = results.join("\n") + "\nDONE " + failed;
})().catch((e) => fail(String(e && e.stack || e)));
});
</script>
</body>
</html>
