{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<header class="page-head"><div><h1>{{ heading }}</h1><p>{{ detail }}</p></div></header>
<section class="panel">
  {% if failure_code %}<p class="hint">Código do erro: <code>{{ failure_code }}</code> · veja em <a href="/diagnostics">Diagnóstico</a></p>{% endif %}
  <p><a class="btn" href="/">Voltar ao painel</a></p>
</section>
{% endblock %}
